kind = "web"
previewPath = "/"
title = "Doação Solidária"
version = "1.0.0"
id = "artifacts/doacao-solidaria"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21574

[services.development]
run = "pnpm --filter @workspace/doacao-solidaria run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doacao-solidaria", "run", "build" ]
publicDir = "artifacts/doacao-solidaria/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21574"
BASE_PATH = "/"
